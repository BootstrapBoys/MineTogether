## Settings file was created by plugin Mine Together v0.2.0
## Plugin GUID: com.bootstrapboys.minetogether

[1. General]

## Enables/Disables the mod.
# Setting type: Boolean
# Default value: true
Enabled = true

## Hold Alt and press B to toggle vein mining on and off. Your own key.
# Setting type: KeyboardShortcut
# Default value: B + LeftAlt
ToggleKey = B + LeftAlt

[2. Vein Mining]

## Vein mining is always active while this is on. ToggleKey flips it at runtime.
# Setting type: Boolean
# Default value: true
VeinMine = true

## Speed added per extra player. 100% is five times vanilla work per swing; 0.5 makes two players 150% and three 200% of that. 0 turns the bonus off.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
MiningSpeedMultiplierPerPlayer = 0.5

## Metres around the deposit in which a player counts towards MiningSpeedMultiplierPerPlayer.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 64
MultiplierPlayerRange = 10

## Maximum contributor distance to an exposed deposit collider.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 2 to 12
MaximumDistance = 6

## Extra prefab names treated as ore deposits.
# Setting type: String
# Default value: 
AdditionalPrefabs =

## Exact prefab names, comma separated, that are never treated as ore deposits. Tin is excluded by default so vein mining leaves the small surface rocks alone.
# Setting type: String
# Default value: MineRock_Tin
ExcludedPrefabs = MineRock_Tin

[3. Resources]

## Scale world resources (mining, lumber, pickables, crates, dungeon loot).
# Setting type: Boolean
# Default value: true
ResourceMultiplier = true

## Multiplier for ore, stone and other mining node drops. 1 = vanilla.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 1 to 10
MiningMultiplier = 1

## Multiplier for wood, fine wood, core wood and other tree drops. 1 = vanilla.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 1 to 10
LumberMultiplier = 1

## Multiplier for hand-picked items (berries, mushrooms, flint, branches). 1 = vanilla.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 1 to 10
PickableMultiplier = 1

## Multiplier for destructible crates and dungeon loot spawners. 1 = vanilla.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 1 to 10
StructureMultiplier = 1

[4. Rock Collapse]

## Rock pieces fall once the deposit no longer rests on enough ground. Vanilla leaves them floating.
# Setting type: Boolean
# Default value: true
FallingDeposits = true

## How much of a rock's original footing must survive; mine past that and the whole rock drops. 0 turns the rule off.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 0 to 90
PercentFootingNeeded = 15

## Size of each piece's support box relative to the piece. Lower makes pieces fall sooner.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 25 to 150
PercentSupportBoxSize = 100

[5. AOE Mining]

## Spread a pickaxe swing over the rocks around the impact point. Never runs while vein mining is active.
# Setting type: Boolean
# Default value: true
AreaMining = true

## Grow the AOE radius with the Pickaxes skill, from RadiusMin at skill 0 to RadiusMax at skill 100.
# Setting type: Boolean
# Default value: true
ScaleWithSkill = true

## AOE radius in metres at Pickaxes 0 (or always, when ScaleWithSkill is off).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 8
RadiusMin = 1

## AOE radius in metres at Pickaxes 100.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0.5 to 10
RadiusMax = 4

## Pickaxe damage added to the AOE swing before it is divided between targets. 0 keeps a vanilla-strength swing.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 50
BonusDamage = 0

## Most rocks one AOE swing may spread damage over.
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 1 to 32
MaxTargets = 16

## Comma-separated name fragments. A rock whose prefab or display name contains one of these is never hit by the AOE effect. Unrelated to ExcludedPrefabs, which filters deposits.
# Setting type: String
# Default value: blackmetal,obsidian,muddy,scrapiron
AOEExcludedPrefabs = blackmetal,obsidian,muddy,scrapiron

[6. Debug]

## Write diagnostics to BepInEx/BSBLogs/MineTogether.log: environment, applied patches, resolved bindings, settings and what each module did. Errors are written even when this is off.
# Setting type: Boolean
# Default value: false
Enable Debug = false
